<!DOCTYPE html><html lang="zh-TW"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>裝備核對與狀況管理系統</title>

  <!-- PWA Web App Capable for Cross-Platform Mobile Use -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (xlsx) for Excel Import/Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 3px;
    }

    /* 列印專用 CSS (Print Stylesheet) - 保持雙欄配置 + 依分類強制分頁 */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 11px !important;
      }
      header, .no-print {
        display: none !important;
      }
      main {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .print-border {
        border: 1px solid #94a3b8 !important;
        break-inside: avoid;
        margin-bottom: 8px !important;
      }
      .print-shadow-none {
        box-shadow: none !important;
      }
      .print-show {
        display: block !important;
      }

      /* 列印區域總容器雙欄網格配置 */
      #equipmentListContainer {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 10px !important;
      }
      
      /* 依視角分類進行強制分頁，同時跨滿兩欄 */
      .print-group-card {
        break-inside: avoid;
        page-break-inside: avoid;
        grid-column: span 2 / span 2 !important;
        break-before: page !important;
        page-break-before: always !important;
      }

      /* 分類卡片內部項目清單改為兩欄並排 */
      .print-group-card .divide-y {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 6px !important;
      }

      .print-group-card .divide-y > div {
        border: 1px solid #e2e8f0 !important;
        border-radius: 6px !important;
      }

      /* 第一個分類群組不強制分頁，避免首頁空白 */
      .print-group-card:first-child {
        break-before: auto !important;
        page-break-before: auto !important;
      }
    }
  </style></head><body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans select-none" onclick="closeAllDropdowns(event)">

  <!-- 列印專用抬頭 (僅在列印時顯示) -->
  <div class="hidden print-show p-4 text-center border-b border-slate-300 mb-4">
    <h1 id="printManagerTitle" class="text-2xl font-bold text-slate-900">中華極光教育休閒養生協會 - 裝備盤點報表</h1>
    <p id="printSubTitle" class="text-sm text-slate-600 mt-1">列印時間：<span id="printDate"></span></p>
  </div>

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      
      <!-- Management Title Section -->
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-lg shadow-inner flex-shrink-0">
          <i class="fa-solid fa-boxes-packing text-xl"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="appManagerTitle" class="font-bold text-lg leading-tight text-amber-300">
              中華極光教育休閒養生協會 - 裝備盤點
            </h1>
            <button onclick="editManagerTitle()" title="修改管理名稱" class="text-slate-400 hover:text-white text-xs">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
          </div>
          <p class="text-xs text-slate-400">跨平台單機 App・自動檔名隔離・手機照片自動輕量化壓縮</p>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="requestAdminAction('import')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold text-xs px-2.5 py-2 rounded-lg flex items-center transition shadow">
          <i class="fa-solid fa-lock text-[10px] mr-1"></i><i class="fa-solid fa-file-import mr-1.5"></i> 導入 Excel
        </button>
        <!-- 隱藏的檔案選擇器 -->
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden" onclick="this.value=''" onchange="handleExcelImport(event)">

        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs px-2.5 py-2 rounded-lg flex items-center transition shadow">
          <i class="fa-solid fa-file-excel mr-1.5"></i> 匯出 Excel
        </button>
        <button onclick="printReport()" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs px-2.5 py-2 rounded-lg flex items-center transition shadow">
          <i class="fa-solid fa-print mr-1.5"></i> 列印 / PDF
        </button>
        
        <!-- JSON 備份與管理密碼設定下拉 -->
        <div class="relative" id="moreDropdownContainer">
          <button onclick="toggleMoreMenu(event)" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold text-xs px-2.5 py-2 rounded-lg flex items-center transition shadow">
            <i class="fa-solid fa-ellipsis-vertical mr-1"></i> 更多 <i class="fa-solid fa-chevron-down ml-1 text-[10px]"></i>
          </button>
          <div id="moreMenuDropdown" class="absolute right-0 mt-1 w-48 bg-white text-slate-800 rounded-lg shadow-xl border border-slate-200 hidden z-50">
            <button onclick="exportJsonBackup()" class="w-full text-left px-3.5 py-2.5 text-xs hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100">
              <i class="fa-solid fa-download text-indigo-600"></i> 匯出 JSON 備份檔
            </button>
            <button onclick="requestAdminAction('restoreJson')" class="w-full text-left px-3.5 py-2.5 text-xs hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100 text-amber-700">
              <i class="fa-solid fa-lock text-[10px]"></i><i class="fa-solid fa-upload"></i> 還原 JSON 備份檔
            </button>
            <!-- 隱藏的 JSON 檔案選擇器 -->
            <input type="file" id="jsonFileInput" accept=".json" class="hidden" onclick="this.value=''" onchange="importJsonBackup(event)">
            
            <button onclick="changeAdminPassword()" class="w-full text-left px-3.5 py-2.5 text-xs hover:bg-slate-100 flex items-center gap-2 text-rose-600">
              <i class="fa-solid fa-key"></i> 修改管理員密碼
            </button>
          </div>
        </div>

        <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-3 py-2 rounded-lg flex items-center transition shadow">
          <i class="fa-solid fa-plus mr-1.5"></i> 新增裝備
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-5 flex-1 w-full space-y-4">

    <!-- Progress Dashboard & Condition Counter -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 print-border print-shadow-none">
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
        
        <!-- Verification Progress -->
        <div class="lg:col-span-2 bg-slate-50 rounded-lg p-3 border border-slate-100 flex flex-col justify-between">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-slate-600 flex items-center">
              <i class="fa-solid fa-list-check text-indigo-600 mr-1.5 no-print"></i> 裝備盤點核對進度
            </span>
            <span id="progressText" class="text-xs font-extrabold text-indigo-700">0 / 0 件 (0%)</span>
          </div>
          <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
            <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- Condition Counter Cards -->
        <div class="lg:col-span-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
          <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-center">
            <div class="text-xs text-emerald-700 font-medium flex items-center justify-center gap-1">
              <i class="fa-solid fa-circle-check no-print"></i> 良好
            </div>
            <div id="countGood" class="text-lg font-black text-emerald-800 mt-0.5">0</div>
          </div>
          <div class="bg-amber-50 border border-amber-200 rounded-lg p-2.5 text-center">
            <div class="text-xs text-amber-700 font-medium flex items-center justify-center gap-1">
              <i class="fa-solid fa-triangle-exclamation no-print"></i> 待修
            </div>
            <div id="countRepair" class="text-lg font-black text-amber-800 mt-0.5">0</div>
          </div>
          <div class="bg-rose-50 border border-rose-200 rounded-lg p-2.5 text-center">
            <div class="text-xs text-rose-700 font-medium flex items-center justify-center gap-1">
              <i class="fa-solid fa-ban no-print"></i> 報廢
            </div>
            <div id="countScrap" class="text-lg font-black text-rose-800 mt-0.5">0</div>
          </div>
          <div class="bg-purple-50 border border-purple-200 rounded-lg p-2.5 text-center">
            <div class="text-xs text-purple-700 font-medium flex items-center justify-center gap-1">
              <i class="fa-solid fa-magnifying-glass-question no-print"></i> 遺失待尋
            </div>
            <div id="countMissing" class="text-lg font-black text-purple-800 mt-0.5">0</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Filters, View Mode & Search -->
    <div class="bg-white rounded-xl shadow-sm border border
