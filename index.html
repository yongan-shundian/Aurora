<!DOCTYPE html><html lang="zh-TW"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>裝備核對與狀況管理系統</title>

  <!-- PWA Web App Capable for Cross-Platform Mobile Use -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (xlsx) for Excel Import/Export -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 3px;
    }

    /* 列印專用 CSS (Print Stylesheet) - 保持雙欄配置 + 依分類強制分頁 */
    @media print {
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 11px !important;
      }
      header, .no-print {
        display: none !important;
      }
      main {
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .print-border {
        border: 1px solid #94a3b8 !important;
        break-inside: avoid;
        margin-bottom: 8px !important;
      }
      .print-shadow-none {
        box-shadow: none !important;
      }
      .print-show {
        display: block !important;
      }

      /* 列印區域總容器雙欄網格配置 */
      #equipmentListContainer {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 10px !important;
      }
      
      /* 依視角分類進行強制分頁，同時跨滿兩欄 */
      .print-group-card {
        break-inside: avoid;
        page-break-inside: avoid;
        grid-column: span 2 / span 2 !important;
        break-before: page !important;
        page-break-before: always !important;
      }

      /* 分類卡片內部項目清單改為兩欄並排 */
      .print-group-card .divide-y {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 6px !important;
      }

      .print-group-card .divide-y > div {
        border: 1px solid #e2e8f0 !important;
        border-radius: 6px !important;
      }

      /* 第一個分類群組不強制分頁，避免首頁空白 */
      .print-group-card:first-child {
        break-before: auto !important;
        page-break-before: auto !important;
      }
    }
  </style></head><body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans select-none" onclick="closeAllDropdowns(event)">

  <!-- 列印專用抬頭 (僅在列印時顯示) -->
  <div class="hidden print-show p-4 text-center border-b border-slate-300 mb-4">
    <h1 id="printManagerTitle" class="text-2xl font-bold text-slate-900">中華極光教育休閒養生協會 - 裝備盤點報表</h1>
    <p id="printSubTitle" class="text-sm text-slate-600 mt-1">列印時間：<span id="printDate"></span></p>
  </div>

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      
      <!-- Management Title Section -->
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-lg shadow-inner flex-shrink-0">
          <i class="fa-solid fa-boxes-packing text-xl"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="appManagerTitle" class="font-bold text-lg leading-tight text-amber-300">
              中華極光教育休閒養生協會 - 裝備盤點
            </h1>
            <button onclick="editManagerTitle()" title="修改管理名稱" class="text-slate-400 hover:text-white text-xs">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
          </div>
          <p class="text-xs text-slate-400">跨平台單機 App・自動檔名隔離・手機照片自動輕量化壓縮</p>
        </div>
      </div>

      <!-- Header Action Buttons -->
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="requestAdminAction('import')" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold text-xs px-2.5 py-2 rounded-lg flex items-center transition shadow">
          <i class="fa-solid fa-lock text-[10px] mr-1"></i><i class="fa-solid fa-file-import mr-1.5"></i> 導入 Excel
        </button>
        <!-- 隱藏的檔案選擇器 -->
        <input type="file" id="excelFileInput" accept=".xlsx, .xls, .csv" class="hidden" onclick="this.value=''" onchange="handleExcelImport(event)">

        <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs px-2.5 py-2 rounded-lg flex items-center transition shadow">
          <i class="fa-solid fa-file-excel mr-1.5"></i> 匯出 Excel
        </button>
        <button onclick="printReport()" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold text-xs px-2.5 py-2 rounded-lg flex items-center transition shadow">
          <i class="fa-solid fa-print mr-1.5"></i> 列印 / PDF
        </button>
        
        <!-- JSON 備份與管理密碼設定下拉 -->
        <div class="relative" id="moreDropdownContainer">
          <button onclick="toggleMoreMenu(event)" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold text-xs px-2.5 py-2 rounded-lg flex items-center transition shadow">
            <i class="fa-solid fa-ellipsis-vertical mr-1"></i> 更多 <i class="fa-solid fa-chevron-down ml-1 text-[10px]"></i>
          </button>
          <div id="moreMenuDropdown" class="absolute right-0 mt-1 w-48 bg-white text-slate-800 rounded-lg shadow-xl border border-slate-200 hidden z-50">
            <button onclick="exportJsonBackup()" class="w-full text-left px-3.5 py-2.5 text-xs hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100">
              <i class="fa-solid fa-download text-indigo-600"></i> 匯出 JSON 備份檔
            </button>
            <button onclick="requestAdminAction('restoreJson')" class="w-full text-left px-3.5 py-2.5 text-xs hover:bg-slate-100 flex items-center gap-2 border-b border-slate-100 text-amber-700">
              <i class="fa-solid fa-lock text-[10px]"></i><i class="fa-solid fa-upload"></i> 還原 JSON 備份檔
            </button>
            <!-- 隱藏的 JSON 檔案選擇器 -->
            <input type="file" id="jsonFileInput" accept=".json" class="hidden" onclick="this.value=''" onchange="importJsonBackup(event)">
            
            <button onclick="changeAdminPassword()" class="w-full text-left px-3.5 py-2.5 text-xs hover:bg-slate-100 flex items-center gap-2 text-rose-600">
              <i class="fa-solid fa-key"></i> 修改管理員密碼
            </button>
          </div>
        </div>

        <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-3 py-2 rounded-lg flex items-center transition shadow">
          <i class="fa-solid fa-plus mr-1.5"></i> 新增裝備
        </button>
      </div>

    </div>
  </header>

  <!-- Main Content Container -->
  <main class="max-w-7xl mx-auto px-4 py-5 flex-1 w-full space-y-4">

    <!-- Progress Dashboard & Condition Counter -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 print-border print-shadow-none">
      <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
        
        <!-- Verification Progress -->
        <div class="lg:col-span-2 bg-slate-50 rounded-lg p-3 border border-slate-100 flex flex-col justify-between">
          <div class="flex justify-between items-center mb-1">
            <span class="text-xs font-bold text-slate-600 flex items-center">
              <i class="fa-solid fa-list-check text-indigo-600 mr-1.5 no-print"></i> 裝備盤點核對進度
            </span>
            <span id="progressText" class="text-xs font-extrabold text-indigo-700">0 / 0 件 (0%)</span>
          </div>
          <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
            <div id="progressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- Condition Counter Cards -->
        <div class="lg:col-span-3 grid grid-cols-2 sm:grid-cols-4 gap-2">
          <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-2.5 text-center">
            <div class="text-xs text-emerald-700 font-medium flex items-center justify-center gap-1">
              <i class="fa-solid fa-circle-check no-print"></i> 良好
            </div>
            <div id="countGood" class="text-lg font-black text-emerald-800 mt-0.5">0</div>
          </div>
          <div class="bg-amber-50 border border-amber-200 rounded-lg p-2.5 text-center">
            <div class="text-xs text-amber-700 font-medium flex items-center justify-center gap-1">
              <i class="fa-solid fa-triangle-exclamation no-print"></i> 待修
            </div>
            <div id="countRepair" class="text-lg font-black text-amber-800 mt-0.5">0</div>
          </div>
          <div class="bg-rose-50 border border-rose-200 rounded-lg p-2.5 text-center">
            <div class="text-xs text-rose-700 font-medium flex items-center justify-center gap-1">
              <i class="fa-solid fa-ban no-print"></i> 報廢
            </div>
            <div id="countScrap" class="text-lg font-black text-rose-800 mt-0.5">0</div>
          </div>
          <div class="bg-purple-50 border border-purple-200 rounded-lg p-2.5 text-center">
            <div class="text-xs text-purple-700 font-medium flex items-center justify-center gap-1">
              <i class="fa-solid fa-magnifying-glass-question no-print"></i> 遺失待尋
            </div>
            <div id="countMissing" class="text-lg font-black text-purple-800 mt-0.5">0</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Filters, View Mode & Search -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-3 space-y-3 no-print">
      <div class="flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-3">
        
        <!-- View Mode Switch -->
        <div class="flex items-center gap-1 bg-slate-100 p-1 rounded-lg overflow-x-auto text-xs font-semibold">
          <button id="viewBtn-item" onclick="switchView('item')" class="px-3 py-1.5 rounded-md transition text-white bg-indigo-600 shadow-sm whitespace-nowrap">
            <i class="fa-solid fa-boxes-stacked mr-1"></i> 依設備項目
          </button>
          <button id="viewBtn-owner" onclick="switchView('owner')" class="px-3 py-1.5 rounded-md transition text-slate-600 hover:text-indigo-600 whitespace-nowrap">
            <i class="fa-solid fa-user-tag mr-1"></i> 依所有人
          </button>
          <button id="viewBtn-location" onclick="switchView('location')" class="px-3 py-1.5 rounded-md transition text-slate-600 hover:text-indigo-600 whitespace-nowrap">
            <i class="fa-solid fa-location-dot mr-1"></i> 依存放地點
          </button>
          <button id="viewBtn-transport" onclick="switchView('transport')" class="px-3 py-1.5 rounded-md transition text-slate-600 hover:text-indigo-600 whitespace-nowrap">
            <i class="fa-solid fa-truck-front mr-1"></i> 依運輸工具
          </button>
          <button id="viewBtn-condition" onclick="switchView('condition')" class="px-3 py-1.5 rounded-md transition text-slate-600 hover:text-indigo-600 whitespace-nowrap">
            <i class="fa-solid fa-heart-pulse mr-1"></i> 依設備狀態
          </button>
        </div>

        <!-- Filters & Search -->
        <div class="flex flex-wrap items-center gap-2 flex-1 lg:max-w-xl justify-end">
          
          <select id="verificationFilter" onchange="applyFilters()" class="text-xs bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="all">核對狀態: 全部</option>
            <option value="checked">已核對</option>
            <option value="unchecked">未核對</option>
          </select>

          <select id="conditionFilter" onchange="applyFilters()" class="text-xs bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="all">設備狀態: 全部</option>
            <option value="良好">良好</option>
            <option value="待修">待修</option>
            <option value="報廢">報廢</option>
            <option value="遺失待尋">遺失待尋</option>
          </select>

          <div class="relative flex-1 min-w-[150px]">
            <input type="text" id="searchInput" oninput="applyFilters()" placeholder="搜尋關鍵字..." class="w-full text-xs pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
          </div>
        </div>

      </div>
    </div>

    <!-- Equipment Items Render Area -->
    <div id="equipmentListContainer" class="space-y-4 min-h-[300px]">
      <!-- Dynamic list -->
    </div>

  </main>

  <!-- Modal: Add / Edit Equipment -->
  <div id="equipmentModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-xl shadow-xl max-w-xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar flex flex-col">
      <div class="px-5 py-3.5 bg-slate-900 text-white rounded-t-xl flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold text-base flex items-center">
          <i class="fa-solid fa-pen-to-square mr-2 text-indigo-400"></i> 編輯裝備資訊
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="equipmentForm" onsubmit="saveEquipment(event)" class="p-5 space-y-4 text-xs">
        <input type="hidden" id="editItemId">

        <!-- Photo Selection -->
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200">
          <label class="block font-bold text-slate-700 mb-1.5">
            <i class="fa-solid fa-camera text-indigo-600 mr-1"></i> 裝備照片
          </label>
          <div class="flex items-center gap-3">
            <div class="w-20 h-20 rounded-lg border border-slate-300 bg-white flex items-center justify-center overflow-hidden flex-shrink-0 relative group">
              <img id="modalPhotoPreview" src="" alt="預覽" class="w-full h-full object-cover hidden">
              <div id="modalPhotoPlaceholder" class="text-slate-300 text-2xl">
                <i class="fa-solid fa-image"></i>
              </div>
            </div>
            <div class="space-y-2 flex-1">
              <div>
                <label class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3 py-1.5 rounded border border-indigo-200 cursor-pointer inline-flex items-center transition">
                  <i class="fa-solid fa-upload mr-1"></i> 拍攝 / 上傳照片
                  <input type="file" id="modalPhotoInput" accept="image/*" class="hidden" onclick="this.value=''" onchange="handlePhotoSelect(event)">
                </label>
                <button type="button" onclick="clearPhoto()" class="text-xs text-rose-600 hover:underline ml-2">清除照片</button>
              </div>
              <div>
                <input type="text" id="modalPhotoUrl" onchange="handlePhotoUrlInput(this.value)" placeholder="或貼上圖片網址 (URL)" class="w-full p-1.5 border border-slate-300 rounded focus:ring-1 focus:ring-indigo-500 outline-none text-xs">
              </div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block font-bold text-slate-700 mb-1">主裝備名稱 <span class="text-rose-500">*</span></label>
            <input type="text" id="modalName" required placeholder="例: 示範極光一號艇" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">組件 / 子項目名稱</label>
            <input type="text" id="modalSubName" placeholder="例: 橡皮艇艇身" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">裝備數量 <span class="text-rose-500">*</span></label>
            <input type="number" id="modalQuantity" min="1" value="1" required class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-1">所有人 / 管理人</label>
            <input type="text" id="modalOwner" placeholder="例: 協會管理組" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <!-- Condition Selection -->
        <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2.5">
          <label class="block font-bold text-slate-700">
            <i class="fa-solid fa-heart-pulse text-indigo-600 mr-1"></i> 設備狀況 / 盤點狀態 <span class="text-rose-500">*</span>
          </label>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <label class="flex items-center justify-center gap-1.5 cursor-pointer font-semibold text-emerald-700 bg-emerald-50 px-2.5 py-2 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition">
              <input type="radio" name="modalCondition" value="良好" checked onchange="handleConditionChange(this.value)" class="text-emerald-600 focus:ring-emerald-500">
              <i class="fa-solid fa-circle-check"></i> 良好
            </label>
            <label class="flex items-center justify-center gap-1.5 cursor-pointer font-semibold text-amber-700 bg-amber-50 px-2.5 py-2 rounded-lg border border-amber-200 hover:bg-amber-100 transition">
              <input type="radio" name="modalCondition" value="待修" onchange="handleConditionChange(this.value)" class="text-amber-600 focus:ring-amber-500">
              <i class="fa-solid fa-triangle-exclamation"></i> 待修
            </label>
            <label class="flex items-center justify-center gap-1.5 cursor-pointer font-semibold text-rose-700 bg-rose-50 px-2.5 py-2 rounded-lg border border-rose-200 hover:bg-rose-100 transition">
              <input type="radio" name="modalCondition" value="報廢" onchange="handleConditionChange(this.value)" class="text-rose-600 focus:ring-rose-500">
              <i class="fa-solid fa-ban"></i> 報廢
            </label>
            <label class="flex items-center justify-center gap-1.5 cursor-pointer font-semibold text-purple-700 bg-purple-50 px-2.5 py-2 rounded-lg border border-purple-200 hover:bg-purple-100 transition">
              <input type="radio" name="modalCondition" value="遺失待尋" onchange="handleConditionChange(this.value)" class="text-purple-600 focus:ring-purple-500">
              <i class="fa-solid fa-magnifying-glass-question"></i> 遺失待尋
            </label>
          </div>

          <!-- Reason Box -->
          <div id="modalReasonBox" class="hidden transition-all pt-2 border-t border-slate-200">
            <label id="modalReasonLabel" class="block font-bold text-amber-800 mb-1">
              <i class="fa-solid fa-comment-dots mr-1"></i> 原因說明 / 損壞或遺失情況
            </label>
            <input type="text" id="modalReason" placeholder="例: 充氣閥卡榫鬆脫損壞，已報備送修..." class="w-full p-2 border border-amber-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none bg-amber-50/50">
          </div>
        </div>

        <!-- Storage Location & Cabinet (拆分雙欄位) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <!-- 存放地點 -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block font-bold text-slate-700">存放地點</label>
              <button type="button" onclick="promptAddPreset('location')" class="text-indigo-600 hover:underline font-semibold text-[11px]">
                <i class="fa-solid fa-plus-circle mr-0.5"></i> 新增地點
              </button>
            </div>
            <input type="text" id="modalLocation" placeholder="例: 北投教室" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none mb-1.5">
            <div class="flex flex-wrap gap-1 text-[11px]" id="locationPresetChips"></div>
          </div>
          
          <!-- 櫃位 / 細部位置 -->
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block font-bold text-slate-700">櫃位 / 細部位置</label>
              <button type="button" onclick="promptAddPreset('cabinet')" class="text-indigo-600 hover:underline font-semibold text-[11px]">
                <i class="fa-solid fa-plus-circle mr-0.5"></i> 新增櫃位
              </button>
            </div>
            <input type="text" id="modalCabinet" placeholder="例: 客廳" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none mb-1.5">
            <div class="flex flex-wrap gap-1 text-[11px]" id="cabinetPresetChips"></div>
          </div>
        </div>

        <!-- Transport Tool -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block font-bold text-slate-700">運輸工具 / 車輛</label>
            <button type="button" onclick="promptAddPreset('transport')" class="text-indigo-600 hover:underline font-semibold text-[11px]">
              <i class="fa-solid fa-plus-circle mr-0.5"></i> 新增車輛選項
            </button>
          </div>
          <input type="text" id="modalTransport" placeholder="例: 小白" class="w-full p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none mb-1.5">
          <div class="flex flex-wrap gap-1 text-[11px]" id="transportPresetChips"></div>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-200">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg">取消</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow">儲存裝備</button>
        </div>
      </form>

  </div>

  <!-- Modal: Admin Password -->
  <div id="adminPasswordModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 no-print">
    <div class="bg-white rounded-xl shadow-2xl max-w-sm w-full p-5 space-y-4">
      <div class="flex items-center gap-3 text-rose-600 border-b border-slate-100 pb-3">
        <div class="bg-rose-100 p-2.5 rounded-full">
          <i class="fa-solid fa-lock text-xl"></i>
        </div>
        <div>
          <h3 id="adminModalTitle" class="font-bold text-base text-slate-900">權限驗證</h3>
          <p id="adminModalDesc" class="text-xs text-slate-500">請輸入管理員密碼</p>
        </div>
      </div>

      <div>
        <label class="block font-bold text-slate-700 text-xs mb-1">請輸入密碼：</label>
        <input type="password" id="adminPasswordInput" placeholder="預設密碼: 8888" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-rose-500 outline-none text-sm text-center font-mono">
        <p id="adminPasswordError" class="text-rose-600 text-xs font-semibold mt-1 hidden">
          <i class="fa-solid fa-triangle-exclamation mr-1"></i> 密碼錯誤，請重新輸入！
        </p>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeAdminModal()" class="px-3.5 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-xs">取消</button>
        <button type="button" onclick="confirmAdminPassword()" class="px-3.5 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-lg shadow text-xs">確認執行</button>
      </div>
    </div>
  </div>

  <!-- Lightbox Photo Preview -->
  <div id="imageLightboxModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 cursor-zoom-out no-print" onclick="closeImageLightbox()">
    <div class="relative max-w-3xl max-h-[90vh]">
      <img id="lightboxImage" src="" alt="裝備大圖" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain">
      <div id="lightboxCaption" class="text-center text-white font-medium text-sm mt-2"></div>
      <button onclick="closeImageLightbox()" class="absolute -top-10 right-0 text-white text-2xl hover:text-amber-400">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
  </div>

  <!-- App Core JS Script -->
  <script>
    // 自動取得目前 HTML 的檔案名稱作為此 App 專屬識別碼，防止資料混淆
    function getAppStoragePrefix() {
      let fileName = window.location.pathname.split('/').pop();
      if (!fileName || fileName === '') fileName = 'default_app';
      fileName = decodeURIComponent(fileName).replace(/\.[^/.]+$/, ""); // 移除副檔名 .html
      return 'equipment_app_' + fileName + '_';
    }

    const STORAGE_PREFIX = getAppStoragePrefix();
    const DEFAULT_ADMIN_PASSWORD = "8888";
    
    let pendingAdminAction = null; 
    let pendingDeleteItemId = null;

    let presetLocations = ['北投教室', '地下室', '萬里', '停車場', '車輛 馬自達'];
    let presetCabinets = ['客廳', '客臥', '主臥', '客臥衣櫃', '停車格'];
    let presetTransports = ['小白', '拖車', '馬自達'];

    // 預設 2 筆範例資料（所有欄位皆完整）
    let equipmentData = [
      {
        "id": 1,
        "name": "示範極光一號艇",
        "subName": "橡皮艇艇身與充氣龍骨",
        "quantity": 1,
        "owner": "協會管理組",
        "location": "北投教室",
        "cabinet": "客廳",
        "transport": "小白",
        "verified": false,
        "condition": "良好",
        "reason": "定檢正常，結構完好",
        "photo": "https://images.unsplash.com/photo-1544551763-46a013bb70d5?auto=format&fit=crop&w=300&q=80"
      },
      {
        "id": 2,
        "name": "示範專業水上救生衣",
        "subName": "高浮力成人救生衣(含哨子)",
        "quantity": 4,
        "owner": "活動器材組",
        "location": "地下室",
        "cabinet": "停車格",
        "transport": "馬自達",
        "verified": false,
        "condition": "待修",
        "reason": "拉鍊扣環脫落，待替換配件",
        "photo": "https://images.unsplash.com/photo-1563298723-dcfebaa392e3?auto=format&fit=crop&w=300&q=80"
      }
    ];

    let currentView = 'item'; 
    let editingPhotoData = ''; 

    document.addEventListener('DOMContentLoaded', () => {
      loadManagerTitle();
      loadLocalData();
      renderPresetChips();
      renderApp();
    });

    function toggleMoreMenu(event) {
      event.stopPropagation();
      const menu = document.getElementById('moreMenuDropdown');
      menu.classList.toggle('hidden');
    }

    function closeAllDropdowns(event) {
      const menu = document.getElementById('moreMenuDropdown');
      if (menu && !menu.classList.contains('hidden')) {
        menu.classList.add('hidden');
      }
    }

    function getAdminPassword() {
      return localStorage.getItem(STORAGE_PREFIX + 'admin_password') || DEFAULT_ADMIN_PASSWORD;
    }

    function changeAdminPassword() {
      const currentPwd = getAdminPassword();
      const inputOld = prompt("請輸入目前的管理員密碼：");
      if (inputOld === null) return;
      if (inputOld !== currentPwd) {
        alert("舊密碼不正確！");
        return;
      }
      const newPwd = prompt("請輸入新的管理員密碼：");
      if (newPwd && newPwd.trim()) {
        localStorage.setItem(STORAGE_PREFIX + 'admin_password', newPwd.trim());
        alert("管理員密碼已成功修改！");
      }
    }

    function requestAdminAction(action, id = null) {
      pendingAdminAction = action;
      pendingDeleteItemId = id;
      
      const title = document.getElementById('adminModalTitle');
      const desc = document.getElementById('adminModalDesc');
      
      if (action === 'delete') {
        title.innerHTML = '<i class="fa-solid fa-trash-can mr-2"></i>刪除權限驗證';
        desc.innerText = '需要管理員密碼才能刪除此設備資料。';
      } else if (action === 'import') {
        title.innerHTML = '<i class="fa-solid fa-file-import mr-2"></i>導入 Excel 權限驗證';
        desc.innerText = '為了防止誤覆蓋現有資料，導入前請輸入密碼。';
      } else if (action === 'restoreJson') {
        title.innerHTML = '<i class="fa-solid fa-upload mr-2"></i>還原 JSON 權限驗證';
        desc.innerText = '還原備份將會覆蓋目前所有盤點進度，請輸入密碼確認。';
      }

      document.getElementById('adminPasswordInput').value = '';
      document.getElementById('adminPasswordError').classList.add('hidden');
      document.getElementById('adminPasswordModal').classList.remove('hidden');
      setTimeout(() => document.getElementById('adminPasswordInput').focus(), 100);
    }

    function closeAdminModal() {
      pendingAdminAction = null;
      pendingDeleteItemId = null;
      document.getElementById('adminPasswordModal').classList.add('hidden');
    }

    function confirmAdminPassword() {
      const pwd = document.getElementById('adminPasswordInput').value;
      if (pwd === getAdminPassword()) {
        if (pendingAdminAction === 'delete' && pendingDeleteItemId !== null) {
          equipmentData = equipmentData.filter(i => i.id !== pendingDeleteItemId);
          saveLocalData();
          closeAdminModal();
          renderApp();
        } else if (pendingAdminAction === 'import') {
          closeAdminModal();
          document.getElementById('excelFileInput').click(); 
        } else if (pendingAdminAction === 'restoreJson') {
          closeAdminModal();
          document.getElementById('jsonFileInput').click();
        }
      } else {
        document.getElementById('adminPasswordError').classList.remove('hidden');
      }
    }

    function loadManagerTitle() {
      const savedTitle = localStorage.getItem(STORAGE_PREFIX + 'manager_title');
      if (savedTitle) {
        document.getElementById('appManagerTitle').innerText = savedTitle;
      } else {
        let rawFileName = window.location.pathname.split('/').pop().replace(/\.[^/.]+$/, "");
        if (rawFileName) {
          document.getElementById('appManagerTitle').innerText = `中華極光教育休閒養生協會 - ${decodeURIComponent(rawFileName)}`;
        }
      }
    }

    function editManagerTitle() {
      const current = document.getElementById('appManagerTitle').innerText;
      const newTitle = prompt('請輸入管理名稱或單位名稱：', current);
      if (newTitle && newTitle.trim()) {
        const clean = newTitle.trim();
        document.getElementById('appManagerTitle').innerText = clean;
        localStorage.setItem(STORAGE_PREFIX + 'manager_title', clean);
      }
    }

    function loadLocalData() {
      const stored = localStorage.getItem(STORAGE_PREFIX + 'equipment_data');
      if (stored) {
        try { equipmentData = JSON.parse(stored); } catch (e) {}
      }
      const storedLocs = localStorage.getItem(STORAGE_PREFIX + 'preset_locations');
      if (storedLocs) {
        try { presetLocations = JSON.parse(storedLocs); } catch (e) {}
      }
      const storedCabs = localStorage.getItem(STORAGE_PREFIX + 'preset_cabinets');
      if (storedCabs) {
        try { presetCabinets = JSON.parse(storedCabs); } catch (e) {}
      }
      const storedTrans = localStorage.getItem(STORAGE_PREFIX + 'preset_transports');
      if (storedTrans) {
        try { presetTransports = JSON.parse(storedTrans); } catch (e) {}
      }
    }

    // 強化儲存功能：加入 try...catch 避免容量超出卡死
    function saveLocalData() {
      try {
        localStorage.setItem(STORAGE_PREFIX + 'equipment_data', JSON.stringify(equipmentData));
        localStorage.setItem(STORAGE_PREFIX + 'preset_locations', JSON.stringify(presetLocations));
        localStorage.setItem(STORAGE_PREFIX + 'preset_cabinets', JSON.stringify(presetCabinets));
        localStorage.setItem(STORAGE_PREFIX + 'preset_transports', JSON.stringify(presetTransports));
      } catch (e) {
        console.error("LocalStorage 儲存失敗：", e);
        alert("⚠️ 儲存失敗！可能因照片累積容量超出手機瀏覽器限制 (5MB)。\n建議點擊照片旁的「清除照片」，或使用圖片網址替代。");
      }
    }

    function exportJsonBackup() {
      const managerName = localStorage.getItem(STORAGE_PREFIX + 'manager_title') || document.getElementById('appManagerTitle').innerText;
      const backupObj = {
        version: "2.3",
        exportDate: new Date().toISOString(),
        managerTitle: managerName,
        presetLocations,
        presetCabinets,
        presetTransports,
        equipmentData
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `${managerName}_備份檔_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported && Array.isArray(imported.equipmentData)) {
            equipmentData = imported.importedData || imported.equipmentData;
            if (Array.isArray(imported.presetLocations)) presetLocations = imported.presetLocations;
            if (Array.isArray(imported.presetCabinets)) presetCabinets = imported.presetCabinets;
            if (Array.isArray(imported.presetTransports)) presetTransports = imported.presetTransports;
            if (imported.managerTitle) {
              document.getElementById('appManagerTitle').innerText = imported.managerTitle;
              localStorage.setItem(STORAGE_PREFIX + 'manager_title', imported.managerTitle);
            }
            saveLocalData();
            renderPresetChips();
            renderApp();
            alert('JSON 備份資料還原成功！');
          } else {
            alert('JSON 備份檔格式無效。');
          }
        } catch (err) {
          alert('解析 JSON 備份檔失敗。');
        } finally {
          event.target.value = ''; 
        }
      };
      reader.readAsText(file);
    }

    function addLocationToPreset(loc) {
      if (!loc) return;
      const cleanLoc = loc.trim();
      if (cleanLoc && !presetLocations.includes(cleanLoc)) {
        presetLocations.push(cleanLoc);
        renderPresetChips();
        saveLocalData();
      }
    }

    function addCabinetToPreset(cab) {
      if (!cab) return;
      const cleanCab = cab.trim();
      if (cleanCab && !presetCabinets.includes(cleanCab)) {
        presetCabinets.push(cleanCab);
        renderPresetChips();
        saveLocalData();
      }
    }

    function addTransportToPreset(trans) {
      if (!trans) return;
      const cleanTrans = trans.trim();
      if (cleanTrans && !presetTransports.includes(cleanTrans)) {
        presetTransports.push(cleanTrans);
        renderPresetChips();
        saveLocalData();
      }
    }

    function promptAddPreset(type) {
      if (type === 'location') {
        const val = prompt("請輸入新增的存放地點選項：");
        if (val && val.trim()) addLocationToPreset(val.trim());
      } else if (type === 'cabinet') {
        const val = prompt("請輸入新增的櫃位選項：");
        if (val && val.trim()) addCabinetToPreset(val.trim());
      } else if (type === 'transport') {
        const val = prompt("請輸入新增的運輸工具/車輛選項：");
        if (val && val.trim()) addTransportToPreset(val.trim());
      }
    }

    function renderPresetChips() {
      document.getElementById('locationPresetChips').innerHTML = presetLocations.map(loc => `
        <button type="button" onclick="appendFieldValue('modalLocation', '${escapeHtml(loc)}')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-0.5 rounded transition">
          + ${escapeHtml(loc)}
        </button>
      `).join('');

      document.getElementById('cabinetPresetChips').innerHTML = presetCabinets.map(cab => `
        <button type="button" onclick="appendFieldValue('modalCabinet', '${escapeHtml(cab)}')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-0.5 rounded transition">
          + ${escapeHtml(cab)}
        </button>
      `).join('');

      document.getElementById('transportPresetChips').innerHTML = presetTransports.map(trans => `
        <button type="button" onclick="appendFieldValue('modalTransport', '${escapeHtml(trans)}')" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-0.5 rounded transition">
          + ${escapeHtml(trans)}
        </button>
      `).join('');
    }

    function appendFieldValue(inputId, val) {
      const input = document.getElementById(inputId);
      if (!input.value.trim()) {
        input.value = val;
      } else if (!input.value.includes(val)) {
        input.value += `, ${val}`;
      }
    }

    function handleConditionChange(conditionValue) {
      const reasonBox = document.getElementById('modalReasonBox');
      const reasonLabel = document.getElementById('modalReasonLabel');
      
      if (conditionValue === '良好') {
        reasonBox.classList.add('hidden');
      } else {
        reasonBox.classList.remove('hidden');
        if (conditionValue === '待修') {
          reasonLabel.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-amber-600 mr-1"></i> 請填寫待修原因 / 故障狀況`;
        } else if (conditionValue === '報廢') {
          reasonLabel.innerHTML = `<i class="fa-solid fa-ban text-rose-600 mr-1"></i> 請填寫報廢原因說明`;
        } else if (conditionValue === '遺失待尋') {
          reasonLabel.innerHTML = `<i class="fa-solid fa-magnifying-glass-question text-purple-600 mr-1"></i> 請填寫遺失備註 / 待尋時間地點`;
        }
      }
    }

    function switchView(view) {
      currentView = view;
      ['item', 'owner', 'location', 'transport', 'condition'].forEach(v => {
        const btn = document.getElementById(`viewBtn-${v}`);
        if (btn) {
          if (v === view) {
            btn.className = "px-3 py-1.5 rounded-md transition text-white bg-indigo-600 shadow-sm whitespace-nowrap font-semibold";
          } else {
            btn.className = "px-3 py-1.5 rounded-md transition text-slate-600 hover:text-indigo-600 whitespace-nowrap font-medium";
          }
        }
      });
      renderApp();
    }

    function applyFilters() { renderApp(); }

    function getFilteredData() {
      const verFilter = document.getElementById('verificationFilter').value;
      const condFilter = document.getElementById('conditionFilter').value;
      const searchText = document.getElementById('searchInput').value.trim().toLowerCase();

      return equipmentData.filter(item => {
        if (verFilter === 'checked' && !item.verified) return false;
        if (verFilter === 'unchecked' && item.verified) return false;
        if (condFilter !== 'all' && item.condition !== condFilter) return false;

        if (searchText) {
          const matchName = item.name.toLowerCase().includes(searchText);
          const matchSub = (item.subName || '').toLowerCase().includes(searchText);
          const matchLoc = (item.location || '').toLowerCase().includes(searchText);
          const matchCab = (item.cabinet || '').toLowerCase().includes(searchText);
          const matchTrans = (item.transport || '').toLowerCase().includes(searchText);
          const matchOwner = (item.owner || '').toLowerCase().includes(searchText);
          const matchReason = (item.reason || '').toLowerCase().includes(searchText);
          return matchName || matchSub || matchLoc || matchCab || matchTrans || matchOwner || matchReason;
        }

        return true;
      });
    }

    function updateProgress() {
      const total = equipmentData.length;
      const verifiedCount = equipmentData.filter(i => i.verified).length;
      const percent = total > 0 ? Math.round((verifiedCount / total) * 100) : 0;

      document.getElementById('progressText').innerText = `${verifiedCount} / ${total} 件 (${percent}%)`;
      document.getElementById('progressBar').style.width = `${percent}%`;

      document.getElementById('countGood').innerText = equipmentData.filter(i => i.condition === '良好').length;
      document.getElementById('countRepair').innerText = equipmentData.filter(i => i.condition === '待修').length;
      document.getElementById('countScrap').innerText = equipmentData.filter(i => i.condition === '報廢').length;
      document.getElementById('countMissing').innerText = equipmentData.filter(i => i.condition === '遺失待尋').length;
    }

    function toggleVerification(id) {
      const item = equipmentData.find(i => i.id === id);
      if (item) {
        item.verified = !item.verified;
        saveLocalData();
        renderApp();
      }
    }

    function getConditionBadge(condition, reason = '') {
      let badgeHtml = '';
      if (condition === '待修') {
        badgeHtml = `<span class="inline-flex items-center gap-1 bg-amber-100 text-amber-800 border border-amber-300 text-[11px] font-bold px-2 py-0.5 rounded-full"><i class="fa-solid fa-triangle-exclamation no-print"></i> 待修</span>`;
      } else if (condition === '報廢') {
        badgeHtml = `<span class="inline-flex items-center gap-1 bg-rose-100 text-rose-800 border border-rose-300 text-[11px] font-bold px-2 py-0.5 rounded-full"><i class="fa-solid fa-ban no-print"></i> 報廢</span>`;
      } else if (condition === '遺失待尋') {
        badgeHtml = `<span class="inline-flex items-center gap-1 bg-purple-100 text-purple-800 border border-purple-300 text-[11px] font-bold px-2 py-0.5 rounded-full"><i class="fa-solid fa-magnifying-glass-question no-print"></i> 遺失待尋</span>`;
      } else {
        badgeHtml = `<span class="inline-flex items-center gap-1 bg-emerald-100 text-emerald-800 border border-emerald-300 text-[11px] font-bold px-2 py-0.5 rounded-full"><i class="fa-solid fa-circle-check no-print"></i> 良好</span>`;
      }

      if (reason && condition !== '良好') {
        badgeHtml += `<span class="text-xs font-semibold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-200 mt-1 sm:mt-0"><i class="fa-solid fa-comment-dots mr-1 no-print"></i>${escapeHtml(reason)}</span>`;
      }

      return badgeHtml;
    }

    function renderApp() {
      updateProgress();
      const filtered = getFilteredData();
      const container = document.getElementById('equipmentListContainer');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-xl p-8 text-center text-slate-400 border border-slate-200 print-border">
            <i class="fa-solid fa-box-open text-4xl mb-2 text-slate-300 no-print"></i>
            <p class="text-sm">無符合條件的裝備資料</p>
          </div>
        `;
        return;
      }

      if (currentView === 'item') {
        renderGroupedByItem(filtered, container);
      } else if (currentView === 'owner') {
        renderGroupedByKey(filtered, container, 'owner', '所有人', 'fa-user-tag', 'bg-teal-700');
      } else if (currentView === 'location') {
        renderGroupedByKey(filtered, container, 'location', '存放地點', 'fa-location-dot', 'bg-sky-700');
      } else if (currentView === 'transport') {
        renderGroupedByKey(filtered, container, 'transport', '運輸工具', 'fa-truck-front', 'bg-indigo-700');
      } else if (currentView === 'condition') {
        renderGroupedByKey(filtered, container, 'condition', '設備狀況', 'fa-heart-pulse', 'bg-purple-800');
      }
    }

    function renderGroupedByItem(data, container) {
      const groups = {};
      data.forEach(item => {
        if (!groups[item.name]) groups[item.name] = [];
        groups[item.name].push(item);
      });

      let html = '';
      for (const [name, items] of Object.entries(groups)) {
        html += `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden transition hover:border-slate-300 print-border print-shadow-none print-group-card">
            <div class="bg-slate-800 text-white px-4 py-2.5 flex justify-between items-center">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-box-archive text-amber-400 no-print"></i>
                <span class="font-bold text-sm">${escapeHtml(name)}</span>
                <span class="bg-slate-700 text-slate-200 text-xs px-2 py-0.5 rounded-full font-medium">共 ${items.length} 個組件/項目</span>
              </div>
            </div>
            <div class="divide-y divide-slate-100">
              ${items.map(item => renderItemRow(item)).join('')}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderGroupedByKey(data, container, keyField, keyTitle, iconClass, headerColorClass) {
      const groups = {};
      data.forEach(item => {
        const keyVal = item[keyField] ? item[keyField] : `(未指定${keyTitle})`;
        if (!groups[keyVal]) groups[keyVal] = [];
        groups[keyVal].push(item);
      });

      let html = '';
      for (const [groupName, items] of Object.entries(groups)) {
        html += `
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden print-border print-shadow-none print-group-card">
            <div class="${headerColorClass} text-white px-4 py-2.5 flex justify-between items-center">
              <div class="flex items-center gap-2">
                <i class="fa-solid ${iconClass} no-print"></i>
                <span class="font-bold text-sm">${keyTitle}: ${escapeHtml(groupName)}</span>
                <span class="bg-white/20 text-white text-xs px-2 py-0.5 rounded-full font-medium">${items.length} 項</span>
              </div>
            </div>
            <div class="divide-y divide-slate-100">
              ${items.map(item => renderItemRow(item, keyField)).join('')}
            </div>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    function renderItemRow(item, hideField = null) {
      const isChecked = item.verified;
      const photoHtml = item.photo
        ? `<img src="${escapeHtml(item.photo)}" alt="裝備" onclick="openImageLightbox('${escapeHtml(item.photo)}', '${escapeHtml(item.name)}')" class="w-12 h-12 rounded-lg object-cover cursor-zoom-in border border-slate-200 hover:scale-105 transition shadow-sm">`
        : `<div class="w-12 h-12 rounded-lg bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-300 text-lg no-print"><i class="fa-solid fa-image"></i></div>`;

      return `
        <div class="p-3 flex items-center gap-3 hover:bg-slate-50 transition ${isChecked ? 'bg-indigo-50/30' : ''}">
          <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleVerification(${item.id})" class="w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 cursor-pointer">
          <div class="flex-shrink-0">${photoHtml}</div>
          <div class="flex-1 min-w-0">
            <!-- 裝備名稱、數量與狀況 -->
            <div class="flex items-center gap-2 flex-wrap">
              <span class="font-bold text-slate-900 text-sm ${isChecked ? 'line-through text-slate-400' : ''}">
                ${escapeHtml(item.name)}
              </span>
              <span class="bg-slate-200 text-slate-700 text-xs px-1.5 py-0.5 rounded font-bold">x${item.quantity || 1}</span>
              ${getConditionBadge(item.condition, item.reason)}
            </div>
            <!-- 組件 / 子名稱（置於下方） -->
            ${item.subName ? `
              <div class="text-xs text-indigo-600 font-medium mt-0.5">
                <i class="fa-solid fa-turn-up rotate-90 text-[10px] mr-1 text-indigo-400 no-print"></i>${escapeHtml(item.subName)}
              </div>
            ` : ''}
            <!-- 存放地點、櫃位、運輸、所有人屬性 -->
            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-1 text-xs text-slate-500">
              ${hideField !== 'location' ? `<span><i class="fa-solid fa-location-dot text-slate-400 mr-1 no-print"></i>存放: <strong class="text-slate-700">${escapeHtml(item.location || '未定')}</strong></span>` : ''}
              <span><i class="fa-solid fa-door-closed text-slate-400 mr-1 no-print"></i>櫃位: <strong class="text-slate-700">${escapeHtml(item.cabinet || '未定')}</strong></span>
              ${hideField !== 'transport' ? `<span><i class="fa-solid fa-truck-front text-slate-400 mr-1 no-print"></i>運輸: <strong class="text-slate-700">${escapeHtml(item.transport || '未定')}</strong></span>` : ''}
              ${hideField !== 'owner' ? `<span><i class="fa-solid fa-user text-slate-400 mr-1 no-print"></i>所有人: <strong class="text-slate-700">${escapeHtml(item.owner || '未指定')}</strong></span>` : ''}
            </div>
          </div>
          <div class="flex items-center gap-1 no-print">
            <button onclick="openEditModal(${item.id})" title="編輯裝備" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button onclick="requestAdminAction('delete', ${item.id})" title="刪除裝備" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-md transition">
              <i class="fa-solid fa-lock text-[10px] mr-0.5"></i><i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>
      `;
    }

    function openAddModal() {
      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-plus-circle mr-2 text-indigo-400"></i> 新增裝備項目`;
      document.getElementById('editItemId').value = '';
      document.getElementById('equipmentForm').reset();
      editingPhotoData = '';
      updatePhotoPreview('');
      handleConditionChange('良好');
      document.getElementById('equipmentModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const item = equipmentData.find(i => i.id === id);
      if (!item) return;

      document.getElementById('modalTitle').innerHTML = `<i class="fa-solid fa-pen-to-square mr-2 text-indigo-400"></i> 編輯裝備資訊`;
      document.getElementById('editItemId').value = item.id;
      document.getElementById('modalName').value = item.name || '';
      document.getElementById('modalSubName').value = item.subName || '';
      document.getElementById('modalQuantity').value = item.quantity || 1;
      document.getElementById('modalOwner').value = item.owner || '';
      document.getElementById('modalLocation').value = item.location || '';
      document.getElementById('modalCabinet').value = item.cabinet || '';
      document.getElementById('modalTransport').value = item.transport || '';
      document.getElementById('modalReason').value = item.reason || '';

      const condRadios = document.getElementsByName('modalCondition');
      condRadios.forEach(radio => {
        radio.checked = (radio.value === (item.condition || '良好'));
      });

      handleConditionChange(item.condition || '良好');
      editingPhotoData = item.photo || '';
      document.getElementById('modalPhotoUrl').value = editingPhotoData.startsWith('http') ? editingPhotoData : '';
      updatePhotoPreview(editingPhotoData);

      document.getElementById('equipmentModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('equipmentModal').classList.add('hidden');
    }

    // 手機照片前端輕量化壓縮機制 (Canvas Resizer)
    function handlePhotoSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const MAX_SIZE = 800; // 手機拍照縮放至長邊最大 800px

          if (width > height) {
            if (width > MAX_SIZE) {
              height = Math.round((height * MAX_SIZE) / width);
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width = Math.round((width * MAX_SIZE) / height);
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 壓縮為 JPEG 品質 0.7，體積從 10MB 降至 100KB 以內
          editingPhotoData = canvas.toDataURL('image/jpeg', 0.7);
          updatePhotoPreview(editingPhotoData);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = ''; 
    }

    function handlePhotoUrlInput(url) {
      if (url.trim()) {
        editingPhotoData = url.trim();
        updatePhotoPreview(editingPhotoData);
      }
    }

    function clearPhoto() {
      editingPhotoData = '';
      document.getElementById('modalPhotoInput').value = '';
      document.getElementById('modalPhotoUrl').value = '';
      updatePhotoPreview('');
    }

    function updatePhotoPreview(src) {
      const img = document.getElementById('modalPhotoPreview');
      const placeholder = document.getElementById('modalPhotoPlaceholder');
      if (src) {
        img.src = src;
        img.classList.remove('hidden');
        placeholder.classList.add('hidden');
      } else {
        img.src = '';
        img.classList.add('hidden');
        placeholder.classList.remove('hidden');
      }
    }

    function saveEquipment(e) {
      e.preventDefault();
      try {
        const id = document.getElementById('editItemId').value;
        const name = document.getElementById('modalName').value.trim();
        const subName = document.getElementById('modalSubName').value.trim();
        const quantity = parseInt(document.getElementById('modalQuantity').value) || 1;
        const owner = document.getElementById('modalOwner').value.trim();
        const location = document.getElementById('modalLocation').value.trim();
        const cabinet = document.getElementById('modalCabinet').value.trim();
        const transport = document.getElementById('modalTransport').value.trim();
        
        const condRadios = document.getElementsByName('modalCondition');
        let condition = '良好';
        condRadios.forEach(r => { if (r.checked) condition = r.value; });

        const reason = (condition !== '良好') ? document.getElementById('modalReason').value.trim() : '';

        if (location) addLocationToPreset(location);
        if (cabinet) addCabinetToPreset(cabinet);
        if (transport) addTransportToPreset(transport);

        if (id) {
          const item = equipmentData.find(i => i.id == id);
          if (item) {
            item.name = name;
            item.subName = subName;
            item.quantity = quantity;
            item.owner = owner;
            item.location = location;
            item.cabinet = cabinet;
            item.transport = transport;
            item.condition = condition;
            item.reason = reason;
            item.photo = editingPhotoData;
          }
        } else {
          const newId = equipmentData.length > 0 ? Math.max(...equipmentData.map(i => i.id)) + 1 : 1;
          equipmentData.push({
            id: newId,
            name,
            subName,
            quantity,
            owner,
            location,
            cabinet,
            transport,
            condition,
            reason,
            photo: editingPhotoData,
            verified: false
          });
        }

        saveLocalData();
        closeModal();
        renderApp();
      } catch (err) {
        console.error("儲存失敗：", err);
        alert("儲存過程發生錯誤：" + err.message);
      }
    }

    function openImageLightbox(src, caption) {
      document.getElementById('lightboxImage').src = src;
      document.getElementById('lightboxCaption').innerText = caption || '';
      document.getElementById('imageLightboxModal').classList.remove('hidden');
    }

    function closeImageLightbox() {
      document.getElementById('imageLightboxModal').classList.add('hidden');
    }

    function handleExcelImport(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: '' });

          if (jsonData.length === 0) {
            alert('Excel 檔案內無資料！');
            return;
          }

          const importedItems = jsonData.map((row, index) => {
            let rawLoc = String(row['存放地點'] || row['物品存放點'] || row['存放點'] || '').trim();
            let rawCab = String(row['櫃位'] || row['細部位置'] || row['櫃位/細部位置'] || '').trim();
            
            if (rawLoc && !rawCab && rawLoc.includes(' ')) {
              const parts = rawLoc.split(' ');
              rawLoc = parts[0];
              rawCab = parts.slice(1).join(' ');
            }

            const trans = String(row['運輸工具'] || row['運輸車輛'] || row['車輛'] || '').trim();
            const reason = String(row['原因/備註'] || row['原因'] || row['狀況原因'] || row['原因說明'] || row['備註'] || '').trim();
            const photo = String(row['照片網址'] || row['照片'] || row['設備照片'] || '').trim();
            const verifiedVal = String(row['核對狀態'] || row['狀態'] || '');
            const isVerified = verifiedVal.includes('已') || row['核對狀態'] === true || verifiedVal === '1';

            return {
              id: Date.now() + index,
              name: String(row['裝備名稱'] || row['設備名稱'] || row['名稱'] || '未命名裝備').trim(),
              subName: String(row['組件/子名稱'] || row['子名稱'] || row['組件'] || row['子編號'] || '').trim(),
              quantity: parseInt(row['數量'] || row['件數'], 10) || 1,
              owner: String(row['所有人'] || row['保管人'] || '').trim(),
              location: rawLoc,
              cabinet: rawCab,
              transport: trans,
              condition: String(row['設備狀況'] || row['裝備狀況'] || row['狀況'] || '良好').trim(),
              reason: reason,
              photo: photo === '[內嵌圖片檔]' ? '' : photo,
              verified: isVerified
            };
          });

          let isReplace = false;
          if (equipmentData.length > 0) {
            isReplace = confirm(`成功解析 ${importedItems.length} 筆資料！\n\n點擊「確定」將【取代並覆蓋】現有資料與選單設定\n點擊「取消」將【附加】在現有清單之後`);
            if (isReplace) {
              equipmentData = importedItems;
            } else {
              equipmentData = [...equipmentData, ...importedItems];
            }
          } else {
            equipmentData = importedItems;
            isReplace = true;
          }

          if (workbook.SheetNames.includes("選單選項設定")) {
            const presetSheet = workbook.Sheets["選單選項設定"];
            const presetJson = XLSX.utils.sheet_to_json(presetSheet, { defval: '' });
            
            if (isReplace) {
              presetLocations = [];
              presetCabinets = [];
              presetTransports = [];
            }

            presetJson.forEach(row => {
              if (row['存放地點選項']) addLocationToPreset(String(row['存放地點選項']));
              if (row['櫃位選項']) addCabinetToPreset(String(row['櫃位選項']));
              if (row['運輸工具選項']) addTransportToPreset(String(row['運輸工具選項']));
            });
          } else {
            importedItems.forEach(item => {
              if (item.location) addLocationToPreset(item.location);
              if (item.cabinet) addCabinetToPreset(item.cabinet);
              if (item.transport) {
                item.transport.split(',').map(s => s.trim()).forEach(t => addTransportToPreset(t));
              }
            });
          }

          saveLocalData();
          renderPresetChips();
          renderApp();
          alert(`Excel 導入完成！目前共 ${equipmentData.length} 筆資料。`);
        } catch (err) {
          alert('解析 Excel 檔案失敗，請確認檔案格式是否正確。');
          console.error(err);
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function exportToExcel() {
      const managerName = localStorage.getItem(STORAGE_PREFIX + 'manager_title') || document.getElementById('appManagerTitle').innerText;
      
      const exportRows = equipmentData.map((item, index) => ({
        '項次': index + 1,
        '管理單位': managerName,
        '裝備名稱': item.name,
        '組件/子名稱': item.subName || '',
        '數量': item.quantity || 1,
        '設備狀況': item.condition || '良好',
        '原因/備註': item.reason || '',
        '核對狀態': item.verified ? '已核對' : '未核對',
        '所有人': item.owner || '',
        '存放地點': item.location || '',
        '櫃位/細部位置': item.cabinet || '',
        '運輸工具': item.transport || '',
        '照片網址': item.photo && item.photo.startsWith('http') ? item.photo : (item.photo ? '[內嵌圖片檔]' : '')
      }));

      const maxLen = Math.max(presetLocations.length, presetCabinets.length, presetTransports.length);
      const presetRows = [];
      for (let i = 0; i < maxLen; i++) {
        presetRows.push({
          '存放地點選項': presetLocations[i] || '',
          '櫃位選項': presetCabinets[i] || '',
          '運輸工具選項': presetTransports[i] || ''
        });
      }

      const workbook = XLSX.utils.book_new();
      
      const worksheetItems = XLSX.utils.json_to_sheet(exportRows);
      XLSX.utils.book_append_sheet(workbook, worksheetItems, "裝備盤點清單");

      const worksheetPresets = XLSX.utils.json_to_sheet(presetRows);
      XLSX.utils.book_append_sheet(workbook, worksheetPresets, "選單選項設定");

      const fileName = `${managerName}_盤點結果_${new Date().toISOString().slice(0,10)}.xlsx`;
      XLSX.writeFile(workbook, fileName);
    }

    function printReport() {
      const managerName = localStorage.getItem(STORAGE_PREFIX + 'manager_title') || document.getElementById('appManagerTitle').innerText;
      document.getElementById('printManagerTitle').innerText = `${managerName} - 盤點清單`;
      document.getElementById('printDate').innerText = new Date().toLocaleString('zh-TW');
      window.print();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script></body></html>
